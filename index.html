<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apartment 360° Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: plan-led tour — floor plan + room list on the left, immersive 360 stage on the right; stacks on phones */
:root{
  --bg:#F5F4F1; --surface:#FFFFFF; --ink:#22211E; --muted:#6E6A62; --line:#E2DED7;
  --accent:#A8692F; --accent-ink:#FFFFFF; --stage:#1B1A18;
  --f-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --plan-bg:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161513; --surface:#201F1C; --ink:#EEEBE5; --muted:#A39E94; --line:#34322D;
  --accent:#D39058; --accent-ink:#1B1A18; --stage:#0E0D0C; --plan-bg:#F3F1EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#201F1C; --ink:#EEEBE5; --muted:#A39E94; --line:#34322D;
  --accent:#D39058; --accent-ink:#1B1A18; --stage:#0E0D0C; --plan-bg:#F3F1EC; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,34px);line-height:1.1;margin:4px 0 0;text-wrap:balance;letter-spacing:-.01em}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{appearance:none;border:0;background:transparent;color:var(--ink);font:600 14px var(--f-body);padding:8px 16px;border-radius:999px;cursor:pointer}
.tab small{font:400 11px var(--f-mono);color:var(--muted);margin-left:6px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab[aria-selected="true"] small{color:inherit;opacity:.7}
.tab:focus-visible,.room:focus-visible,.pin:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.plan{position:relative;background:var(--plan-bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.plan img{display:block;width:100%;height:auto}
.planbox{position:relative}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font:600 13px var(--f-mono);display:grid;place-items:center;
  box-shadow:0 0 0 4px rgba(168,105,47,.22),0 2px 6px rgba(0,0,0,.25);transition:transform .15s}
.pin:hover{transform:translate(-50%,-50%) scale(1.1)}
.pin.active{background:#22211E;color:#fff;box-shadow:0 0 0 5px rgba(34,33,30,.25),0 2px 6px rgba(0,0,0,.3)}
.pin.active::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid #22211E;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{opacity:.8;transform:scale(.8)}to{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.pin.active::after{animation:none}.pin{transition:none}}
.rooms{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.room{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);font:500 14px var(--f-body)}
.room .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-mono);background:var(--line);color:var(--ink)}
.room .sv{font:400 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.room[aria-current="true"]{border-color:var(--accent)}
.room[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink)}
.stage{position:relative;min-width:0;background:var(--stage);border-radius:10px;overflow:hidden;height:min(72vh,720px);min-height:340px}
#pano{position:absolute;inset:0}
.caption{position:absolute;left:52px;top:12px;z-index:3;pointer-events:none;background:rgba(20,19,17,.62);color:#fff;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;padding:8px 12px;max-width:calc(100% - 64px)}
.caption b{display:block;font:600 15px var(--f-body)}
.caption span{font:400 11px var(--f-mono);letter-spacing:.06em;opacity:.8}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;pointer-events:none;
  font:400 12px var(--f-mono);color:#fff;background:rgba(20,19,17,.55);padding:5px 12px;border-radius:999px;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin:0}
/* in-panorama room links */
.go{width:auto!important;height:auto!important;background:none!important;cursor:pointer}
.go div{transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;
  background:rgba(255,255,255,.92);color:#22211E;font:600 12.5px var(--f-body);padding:6px 11px 6px 7px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.go div::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--accent);
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.9)}
.go:hover div{background:#fff}
.pnlm-hotspot-base.go{margin:0}
.pnlm-load-box{background:rgba(20,19,17,.8)!important;border-radius:8px!important}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.stage{order:-1;height:62vh;min-height:300px}
  aside{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}}
@media (max-width:520px){aside{grid-template-columns:minmax(0,1fr)}.plan{max-width:340px;width:100%;margin:0 auto}
  .tab{padding:7px 12px}.tab small{display:none}}

<body>


<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Interactive 360° tour · 2 apartments</div>
      <h1 id="aptTitle">Apartment A</h1>
    </div>
    <div class="tabs" role="tablist" aria-label="Choose apartment">
      <button class="tab" role="tab" id="tab-a" data-apt="a" aria-selected="true">Apartment A<small>2 rooms</small></button>
      <button class="tab" role="tab" id="tab-b" data-apt="b" aria-selected="false">Apartment B<small>Studio</small></button>
    </div>
  </header>
  <div class="grid">
    <aside>
      <div class="plan"><div class="planbox" id="planbox"><img id="planImg" src="img/plan-a.png" alt="Floor plan"></div></div>
      <div>
        <ul class="rooms" id="rooms"></ul>
        <p class="note" style="margin-top:10px">Tap a number on the plan or a room in the list. Inside the view, drag to look around and use the round labels to walk to the next room.</p>
      </div>
    </aside>
    <div class="stage">
      <div id="pano"></div>
      <div class="caption" id="cap"><b>—</b><span></span></div>
      <div class="hint" id="hint">Drag to look around</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<script>
const APTS={
  a:{title:"Apartment A",plan:"img/plan-a.png",rooms:[
    {id:"a-living",name:"Living & Kitchen",sv:"KÖK/VARD · 21 m²",x:31.8,y:36.7},
    {id:"a-bedroom",name:"Bedroom",sv:"RUM · 10 m²",x:59.2,y:34.7},
    {id:"a-hall",name:"Hall",sv:"HALL · 2 m²",x:56.7,y:69.3}]},
  b:{title:"Apartment B",plan:"img/plan-b.png",rooms:[
    {id:"b-room",name:"Living & Kitchen",sv:"RUM · 21 m²",x:24.0,y:27.3},
    {id:"b-hall",name:"Hall",sv:"HALL · 5 m²",x:22.7,y:76.1}]}
};
const ROOM={};Object.entries(APTS).forEach(([k,a])=>a.rooms.forEach(r=>{r.apt=k;ROOM[r.id]=r}));
function link(to,yaw,pitch){return {type:"scene",sceneId:to,yaw:yaw,pitch:pitch,cssClass:"go",
  createTooltipFunc:(div)=>{const d=document.createElement("div");d.textContent=ROOM[to].name;div.appendChild(d)}}}
const scenes={
  "a-living":{panorama:"img/a-living.jpg",yaw:-70,hotSpots:[link("a-bedroom",-119,-4),link("a-hall",-51,-6)]},
  "a-bedroom":{panorama:"img/a-bedroom.jpg",yaw:-40,hotSpots:[link("a-living",70,-6)]},
  "a-hall":{panorama:"img/a-hall.jpg",yaw:-20,hotSpots:[link("a-living",85,-5)]},
  "b-room":{panorama:"img/b-room.jpg",yaw:0,hotSpots:[link("b-hall",178,-6)]},
  "b-hall":{panorama:"img/b-hall.jpg",yaw:0,hotSpots:[link("b-room",2,-6)]}
};
Object.values(scenes).forEach(s=>{s.type="equirectangular";s.hfov=105;s.pitch=-2});
let start="a-living";
try{const h=location.hash.slice(1);if(ROOM[h])start=h;else if(APTS[h])start=APTS[h].rooms[0].id}catch(e){}
const viewer=pannellum.viewer("pano",{default:{firstScene:start,sceneFadeDuration:600,autoLoad:true,showControls:true,
  compass:false,mouseZoom:true,minHfov:55,maxHfov:120},scenes});
let curApt=null;
function renderApt(k){
  curApt=k;const a=APTS[k];
  document.getElementById("aptTitle").textContent=a.title;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.apt===k));
  document.getElementById("planImg").src=a.plan;
  const box=document.getElementById("planbox");box.querySelectorAll(".pin").forEach(p=>p.remove());
  const ul=document.getElementById("rooms");ul.innerHTML="";
  a.rooms.forEach((r,i)=>{
    const p=document.createElement("button");p.className="pin";p.textContent=i+1;p.dataset.id=r.id;
    p.style.left=r.x+"%";p.style.top=r.y+"%";p.setAttribute("aria-label","View "+r.name+" in 360");
    p.onclick=()=>go(r.id);box.appendChild(p);
    const li=document.createElement("li");
    li.innerHTML=`<button class="room" data-id="${r.id}"><span class="n">${i+1}</span><span>${r.name}</span><span class="sv">${r.sv}</span></button>`;
    li.firstChild.onclick=()=>go(r.id);ul.appendChild(li);
  });
}
function mark(id){
  const r=ROOM[id];if(r.apt!==curApt)renderApt(r.apt);
  document.querySelectorAll(".pin").forEach(p=>p.classList.toggle("active",p.dataset.id===id));
  document.querySelectorAll(".room").forEach(b=>b.setAttribute("aria-current",b.dataset.id===id));
  const c=document.getElementById("cap");c.querySelector("b").textContent=r.name;
  c.querySelector("span").textContent=APTS[r.apt].title+" · "+r.sv;
}
function go(id){if(viewer.getScene()!==id)viewer.loadScene(id);mark(id)}
viewer.on("scenechange",mark);
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>go(APTS[t.dataset.apt].rooms[0].id));
renderApt(ROOM[start].apt);mark(start);
const hint=document.getElementById("hint");viewer.on("mousedown",()=>{hint.hidden=true});viewer.on("touchstart",()=>{hint.hidden=true});
</script>


</body>
</html>
